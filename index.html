<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginPage" class="center">
  <div class="loginBox">
    <h1>Update Portal</h1>
    <p class="subtitle">Employee ID দিয়ে লগইন করুন</p>

    <input type="text" id="userInput" placeholder="Enter User ID">

    <button onclick="login()">Login</button>
  </div>
</div>

<div id="dashboard" style="display:none;">

  <div class="navbar">
    <div class="logoArea">
      <h2>Update Portal</h2>
    </div>

    <div class="navRight">
      <button onclick="toggleTheme()" class="themeBtn">🌙</button>
      <button onclick="logout()" class="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="searchBar">
    <input type="text" id="searchInput" placeholder="Search updates..." onkeyup="renderUpdates()">
  </div>

  <div class="layout">
    <div class="left">
      <h3>Recent Updates</h3>
      <div id="recentUpdates"></div>
    </div>

    <div class="right">
      <h3>All Updates</h3>
      <div id="allUpdates"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
